function setKey(n) {
  const s = String(n);
  if (/^\d+$/.test(s)) return [0, Number(s), ""];
  return [1, 0, s.toLowerCase()];
}
function byName(a, b) {
  return a.localeCompare(b, undefined, { sensitivity: "base" });
}

const themes = new Map();
for (const set of SETS) {
  const theme = set.theme || "(no theme)";
  const sub = set.subtheme || "(no subtheme)";
  if (!themes.has(theme)) themes.set(theme, new Map());
  const subs = themes.get(theme);
  if (!subs.has(sub)) subs.set(sub, []);
  subs.get(sub).push(set);
}

const app = document.getElementById("app");
const themeNames = [...themes.keys()].sort(byName);
for (const theme of themeNames) {
  const h2 = document.createElement("h2");
  h2.textContent = theme;
  app.appendChild(h2);
  const subs = themes.get(theme);
  const subNames = [...subs.keys()].sort(byName);
  for (const sub of subNames) {
    const h3 = document.createElement("h3");
    h3.textContent = sub;
    app.appendChild(h3);
    const grid = document.createElement("div");
    grid.className = "grid";
    const sets = subs.get(sub).slice().sort((a, b) => {
      const ka = setKey(a.number);
      const kb = setKey(b.number);
      if (ka[0] !== kb[0]) return ka[0] - kb[0];
      if (ka[1] !== kb[1]) return ka[1] - kb[1];
      return ka[2].localeCompare(kb[2]);
    });
    for (const set of sets) {
      const card = document.createElement("article");
      const img = document.createElement("img");
      img.alt = set.name;
      img.src = set.image;
      img.loading = "lazy";
      const num = document.createElement("p");
      num.className = "num";
      num.textContent = set.number;
      const name = document.createElement("p");
      name.className = "name";
      name.textContent = set.name;
      card.append(img, num, name);
      grid.appendChild(card);
    }
    app.appendChild(grid);
  }
}
document.getElementById("count").textContent = SETS.length + " sets";
</script>
